services:
  postgres:
    image: postgres:16-alpine
    container_name: cpip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpip}
      POSTGRES_DB: ${POSTGRES_DB:-cpip}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cpip_backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpip}
      POSTGRES_DB: ${POSTGRES_DB:-cpip}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cpip_frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  pgdata:
